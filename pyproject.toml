# Пояснения:
# 1. Основные зависимости сведены в pyproject.toml.
# 2. Рабочее окружение зафиксировано через uv.lock, чтобы на разных машинах не
#    получались разные наборы версий.
[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "moneyprinterturbo"
version = "1.3.5"
description = "Generate short videos from prompts, local assets, subtitles, and TTS."
readme = "README-en.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "moviepy==2.2.1",
    "streamlit==1.59.1",
    "streamlit-tour==1.1.0",
    "edge-tts==7.2.7",
    "fastapi==0.136.3",
    "uvicorn==0.32.1",
    "openai==2.24.0",
    "faster-whisper==1.1.0",
    "loguru==0.7.3",
    "dashscope==1.20.14",
    "azure-cognitiveservices-speech==1.41.1",
    "redis==5.2.0",
    "python-multipart==0.0.27",
    "pyyaml==6.0.3",
    "requests==2.33.1",
    "packaging==24.2",
    "socksio==1.0.0",
    "pydub==0.25.1",
    "audioop-lts==0.2.2; python_version >= '3.13'",
    "litellm==1.86.2",
    "google-genai==2.11.0",
]

[project.optional-dependencies]
# Optional TwelveLabs (https://twelvelabs.io) video-understanding/embedding
# integration. Only needed when `twelvelabs_api_keys` is configured; install
# with `uv sync --extra twelvelabs`.
twelvelabs = [
    "twelvelabs>=1.2.8",
]

[dependency-groups]
dev = [
    "coverage==7.15.1",
    "pytest==9.1.1",
    "ruff==0.15.21",
]

[tool.ruff.lint.per-file-ignores]
# WebUI сперва добавляет корень проекта в sys.path и только затем импортирует пакет app.
"webui/Main.py" = ["E402"]

[tool.coverage.run]
# Покрытие по ветвям выявляет случаи «строка выполнилась, но вторая ветка условия ни
# разу не проверена» и подходит как базовый критерий качества в CI лучше, чем одно лишь
# построчное покрытие. CLI и WebUI — тоже производственные точки входа, поэтому они
# учитываются вместе с сервисным слоем app, точкой запуска сервиса и скриптом Skill для
# агентов: иначе покрытие отражало бы лишь часть модулей.
branch = true
source = ["app", "cli", "webui", "main", "docs/skill"]

[tool.coverage.report]
# Фактическое покрытие по ветвям при полном прогоне на Python 3.11 и 3.13 превышает
# 70.4%. Порог 70% закрепляет тесты состояний сбоя, восстановления асинхронной
# публикации и атомарных обновлений Redis, оставляя запас на небольшие расхождения
# ветвей между версиями Python и операционными системами.
fail_under = 70
show_missing = true
skip_covered = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
# Проект существует прежде всего как запускаемое приложение и не устанавливается как публикуемый Python-пакет.
package = false
