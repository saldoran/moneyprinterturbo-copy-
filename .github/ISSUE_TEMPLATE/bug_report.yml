name: 🐛 Bug | Bug Report
description: Сообщить об ошибке или неожиданном поведении | Report an error or unexpected behavior
title: "[Bug]: "
labels:
  - bug

body:
  - type: markdown
    attributes:
      value: |
        **Перед отправкой issue убедитесь, что прочли документацию: [Getting Started (English)](https://github.com/harry0703/MoneyPrinterTurbo/blob/main/README-en.md#system-requirements-) или [Быстрый старт (кит.)](https://github.com/harry0703/MoneyPrinterTurbo/blob/main/README.md#%E5%BF%AB%E9%80%9F%E5%BC%80%E5%A7%8B-).**
        
        **Before submitting an issue, please make sure you've read the following documentation: [Getting Started (English)](https://github.com/harry0703/MoneyPrinterTurbo/blob/main/README-en.md#system-requirements-) or [Quick Start (Chinese)](https://github.com/harry0703/MoneyPrinterTurbo/blob/main/README.md#%E5%BF%AB%E9%80%9F%E5%BC%80%E5%A7%8B-).**
        
  - type: textarea
    attributes:
      label: Описание проблемы | Current Behavior
      description: |
        Опишите проблему, с которой вы столкнулись
        Describe the issue you're experiencing
      placeholder: |
        Когда я выполняю..., программа ведёт себя так: ...
        When I perform..., the program shows...
    validations:
      required: true
  - type: textarea
    attributes:
      label: Шаги воспроизведения | Steps to Reproduce
      description: |
        Подробно опишите, как воспроизвести проблему
        Describe in detail how to reproduce this issue
      placeholder: |
        1. Открываю...
        2. Нажимаю...
        3. Возникает ошибка...
        
        1. Open...
        2. Click on...
        3. Error occurs...
    validations:
      required: true
  - type: textarea
    attributes:
      label: Логи ошибок | Error Logs
      description: |
        Приложите текст ошибки или логи (не включайте в них чувствительные данные)
        Please provide any error messages or logs (be careful not to include sensitive information)
      placeholder: |
        Текст ошибки, логи или скриншоты...
        Error messages, logs, or screenshots...
    validations:
      required: true
  - type: input
    attributes:
      label: Версия Python | Python Version
      description: |
        Используемая вами версия Python
        The Python version you're using
      placeholder: v3.13.0, v3.10.0, etc.
    validations:
      required: true
  - type: input
    attributes:
      label: Операционная система | Operating System
      description: |
        Сведения о вашей операционной системе
        Your operating system information
      placeholder: macOS 14.1, Windows 11, Ubuntu 22.04, etc.
    validations:
      required: true
  - type: input
    attributes:
      label: Версия MoneyPrinterTurbo | Version
      description: |
        Используемая вами версия MoneyPrinterTurbo
        The version of MoneyPrinterTurbo you're using
      placeholder: v1.2.2, etc.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Дополнительные сведения | Additional Information
      description: |
        Другая информация, полезная для решения проблемы (скриншоты, видео и т. п.)
        Any other information that might help solve the issue (screenshots, videos, etc.)
    validations:
      required: false